# Rehearsal of the improvised landmark calls: remain east of Reseda
# Boulevard, extend the downwind to Devonshire and turn base there.
#
#   cargo run --release --bin eval -- --scenario demo/rehearse/extras.yaml \
#     --pilot-llm-provider claude-code --pilot-llm-model claude-sonnet-5-5 --pilot-mode realistic
id: rehearse-extras
description: Remain east of Reseda, base at Devonshire, land 16R
airport: KVNY
start:
  airborne: {runway: 16R, along_ft: 3000, right_ft: 5500, alt_msl_ft: 1800, heading_deg: 355.5, ias_kt: 80}
briefing: >
  You are Cessna 172SP, callsign "Skyhawk 2SP", on a right downwind
  for runway 16R at Van Nuys (KVNY) at pattern altitude, inbound for a full
  stop. The autopilot is holding heading, altitude and speed for now. COM1
  is on Van Nuys Tower, 119.3: call them, and fly their instructions.
max_sim_s: 1200

messages:
  - at_s: 4
    atc: "Skyhawk 2SP, Van Nuys Tower, remain east of Reseda Boulevard, extend your downwind to Devonshire and turn base there, runway 16R cleared to land."

checks:
  - {check: remain, holds: {cond: side_of, target: {ref: place, name: Reseda Boulevard}, side_deg: 90}, label: east of Reseda}
  - {check: turn, leg: base, near: {ref: runway_frame, airport: KVNY, runway: 16R, along_ft: -14000, right_ft: 5500}, tol_ft: 3000}
  - {check: landed, runway: 16R}
  - {check: no_crash}
