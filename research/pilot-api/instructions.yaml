# --- Instructor / handbook phrasing -------------------------------------------

- id: P1
  source: AFH ch6 (normal takeoff)
  family: instructor
  text: After a positive rate of climb is established and the airplane has accelerated to Vy, retract the flaps.
- id: P2
  source: AFH ch6
  family: instructor
  text: Maintain takeoff power until reaching at least 500 feet above the surrounding terrain or obstacles.
- id: P3
  source: AFH ch6 / ACS PA.IV.E
  family: instructor
  text: Short-field takeoff - climb at Vx until clear of obstacles or 50 feet, then accelerate to Vy (+10/-5) and retract flaps in increments.
- id: P4
  source: AFH ch8
  family: instructor
  text: If remaining in the pattern, turn crosswind beyond the departure end of the runway, within 300 feet of pattern altitude.
- id: P5
  source: AFH ch8
  family: instructor
  text: If departing the pattern, continue straight out or exit with a 45 degree turn in the pattern direction beyond the departure end, after reaching pattern altitude.
- id: P6
  source: AFH ch8
  family: instructor
  text: Enter the pattern at a 45 degree angle to the downwind, headed toward a point abeam midfield, at pattern altitude.
- id: P7
  source: AFH ch8
  family: instructor
  text: Arriving from the upwind side - cross midfield at least 500 feet above pattern altitude; when about 2 miles clear, descend to pattern altitude, then turn to enter on the 45.
- id: P8
  source: AFH ch8
  family: instructor
  text: Alternate upwind-side entry - enter on a midfield crosswind at pattern altitude, then turn downwind.
- id: P9
  source: AFH ch8
  family: instructor
  text: Fly the downwind about 1/2 to 1 mile from the landing runway, at pattern altitude.
- id: P10
  source: AFH ch8
  family: instructor
  text: Maintain pattern altitude until at least abeam the approach end; then reduce power and begin the descent.
- id: P11
  source: AFH ch8
  family: instructor
  text: Continue downwind until the approach end is about 45 degrees behind, then make a medium-bank turn onto base.
- id: P12
  source: AFH ch8
  family: instructor
  text: On base, keep the ground track perpendicular to the extended centerline; crab into the wind as needed.
- id: P13
  source: AFH ch9
  family: instructor
  text: With a strong wind on final, or a steep approach with flaps, position the base leg closer to the approach end.
- id: P14
  source: AFH ch9 / ACS PA.IV.B.S7
  family: instructor
  text: On final, fly the manufacturer's approach speed, or 1.3 Vso if there is none, +10/-5 knots.
- id: P15
  source: AFH ch9
  family: instructor
  text: Full flaps are not recommended until established on final.
- id: P16
  source: AFH ch9
  family: instructor
  text: Be stabilized (speed +10/-5 of landing speed, landing configuration, trimmed) by 500 feet AGL or go around; if the approach becomes unstabilized below 300 feet AGL, go around immediately.
- id: P17
  source: AFH ch9
  family: instructor
  text: If descending faster than 500 fpm, reduce the descent rate before 300 feet AGL.
- id: P18
  source: AFH ch9
  family: instructor
  text: Start the round out at about 10 to 20 feet above the runway.
- id: P19
  source: AFH ch9
  family: instructor
  text: Go-around - power first, then attitude, then configuration; once the descent has stopped, retract flaps to the takeoff setting.
- id: P20
  source: AFH ch8
  family: instructor
  text: After a go-around, at a safe altitude, shift to the upwind side so departing traffic stays in view.
- id: P21
  source: ACS PA.III.B.S5
  family: instructor
  text: Maintain traffic pattern altitude +/-100 feet and the appropriate airspeed +/-10 knots.
- id: P22
  source: ACS PA.IV.B.S10 / PA.IV.F.S10
  family: instructor
  text: Touch down within 400 feet beyond the specified point (normal landing); within 200 feet (short-field).
- id: P23
  source: AFH ch7
  family: instructor
  text: Rectangular course - maintain a constant distance from the field boundaries at constant altitude and airspeed, correcting for wind.
- id: P24
  source: AFH ch9
  family: instructor
  text: Use a forward slip to steepen the descent without gaining airspeed.
- id: P25
  source: ACS PA.V.A.S5
  family: instructor
  text: Steep turn - 45 degree bank, maintain entry altitude +/-100 feet, airspeed +/-10 knots, bank +/-5 degrees, roll out on the entry heading +/-10 degrees.
