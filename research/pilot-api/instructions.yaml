# Curated instruction corpus for designing a pilot-vocabulary control API.
#
# ATC items come from Whisper transcripts of LiveATC recordings
# (research/atc-corpus/, copied from weyland:/Volumes/shared/atc). `text` is a
# cleaned reading; `raw` is the Whisper line it came from, kept so cleanups can
# be checked. Callsigns are dropped from `text` unless they matter.
#
# Instructor items come from the FAA Airplane Flying Handbook (FAA-H-8083-3C,
# research/afh/) and the Private Pilot ACS (FAA-S-ACS-6C).
#
# `family` groups items for the worked examples in DRAFT.md.

# --- Pattern shape -----------------------------------------------------------

- id: A1
  source: ATC KVNT
  family: pattern_shape
  text: Extend downwind, I'll call your base.
  raw: "N16L, extend downwind, I'll call your base."
- id: A2
  source: ATC KWHP
  family: pattern_shape
  text: Extend downwind one mile.
  raw: "6M, PAPA, extend downwind, one mile."
- id: A3
  source: ATC KVNY
  family: pattern_shape
  text: Extend about another half mile on the upwind before you turn crosswind, to tighten up the traffic.
  raw: "8NR, Delta, extend about another half mile on the upwind before you turn crosswind to tighten up the traffic."
- id: A4
  source: ATC KAVL
  family: pattern_shape
  text: Extend your upwind, I'll call your crosswind.
  raw: "Western 116, extend your upwind, I'll call to crosswind."
- id: A5
  source: ATC KVNT
  family: pattern_shape
  text: Extend downwind just one more mile and square your left base turn and final; one departure prior to your arrival.
  raw: "N4J, Fox Sharp, extend downwind just one more mile and square your left base turn and final one departure for our travel to Global Express, taking the runway now."
- id: A6
  source: ATC KVNY
  family: pattern_shape
  text: You're inside of a Cirrus on an 8 mile final; keep your base in close, runway 16R, cleared for the option.
  raw: "Cessna 07, you're inside of a Cirrus 8 mile, follow, keep your base in close, runway 16R, cleared for the option."
- id: A7
  source: ATC KWHP
  family: pattern_shape
  text: Keep it wide on the downwind, I have a no-radio aircraft inbound for the straight-in.
  raw: "Cap 41, keep it wide on the downwind, I have a no-coms traffic inbound for the straight in."
- id: A8
  source: ATC KVNY
  family: pattern_shape
  text: Keep your base square, you'll be following a Sport Cruiser now.
  raw: "Piper 84015, keep your base square, you'll be following a sports cruiser now."
- id: A9
  source: ATC KVNY
  family: pattern_shape
  text: For sequencing, make a tight right pattern.
  raw: "N6L, N6L, for sequencing, make a tight right"

