# "Left downwind departure approved, remain at or below 1800 until north
# of the field." (E1) Climbing out of 16R at Van Nuys: left traffic is
# east of the runway, and the downwind leg leads north past the field.
# The corpus item ends there; "then climb and maintain 2500" is added to
# test the follow-on, kept below Burbank's Class C shelf (floor 3000) so
# the pilot has no airspace reason to hold lower.
id: E1
items: [E1]
description: Left downwind departure, at or below 1800 until north of the field
airport: KVNY
tool_set: plan
start:
  airborne: {runway: 16R, along_ft: 5500, right_ft: 0, alt_agl_ft: 350, heading_deg: 175.5, ias_kt: 72}
briefing: >
  You are Cessna 172SP, callsign "Skyhawk 2SP", just airborne off runway
  16R at Van Nuys (KVNY), climbing through about 1150 ft, talking to Van
  Nuys Tower on 119.3. You're departing north to the Whiteman area. The
  autopilot is holding runway heading, altitude and speed for now.
messages:
  - at_s: 0
    atc: "Skyhawk 2SP, left downwind departure approved, remain at or below 1800 until north of the field, then climb and maintain 2500."
end_after_s: 480
max_sim_s: 600
checks:
  - check: remain
    holds: {cond: at_or_below, altitude_ft: 1800}
    until: {cond: side_of, target: {ref: airport, ident: KVNY}, side_deg: 0}
  - check: reached
    label: out east of the runway (left traffic side)
    cond: {cond: all, conds: [{cond: side_of, target: {ref: runway, airport: KVNY, runway: 16R, part: extended_centerline}, side_deg: 90}, {cond: not, of: {cond: within, distance_ft: 2000, target: {ref: runway, airport: KVNY, runway: 16R, part: extended_centerline}}}]}
  - check: reached
    label: north of the field
    cond: {cond: side_of, target: {ref: airport, ident: KVNY}, side_deg: 0}
  - check: reached
    label: climbed to 2500 after
    cond: {cond: all, conds: [{cond: side_of, target: {ref: airport, ident: KVNY}, side_deg: 0}, {cond: at_or_above, altitude_ft: 2400}]}
  - {check: no_crash}
