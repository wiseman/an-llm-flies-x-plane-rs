# "Can you make a short approach?" (G11), then "Short approach approved,
# runway 34R, cleared for the option." (G10). Right downwind 34R at
# midfield. The pilot should check (preview) before answering, then fly a
# base turn about abeam the threshold instead of the usual 45°.
id: G11
items: [G11, G10]
description: Can you make a short approach? Then short approach approved, cleared for the option
airport: KVNY
start:
  airborne: {runway: 34R, along_ft: 4000, right_ft: 6000, alt_msl_ft: 1800, heading_deg: 175.5, ias_kt: 85}
briefing: >
  You are Cessna 172SP, callsign "Skyhawk 2SP", on a right downwind for
  runway 34R at Van Nuys (KVNY), at pattern altitude, talking to Van Nuys
  Tower on 119.3. The autopilot is holding heading, altitude and speed
  for now. Fly the tower's instructions.
messages:
  - at_s: 0
    atc: "Skyhawk 2SP, can you make a short approach?"
  - at_s: 25
    atc: "Skyhawk 2SP, short approach approved, runway 34R, cleared for the option."
end_after_s: 420
max_sim_s: 600
checks:
  - {check: radio, label: answered able, any: ["able", "affirm", "can do", "wilco", "yes"], none_of: ["unable", "negative"]}
  # Abeam the threshold the base turn starts about 6000 ft from it; the
  # usual 45° turn starts about 8500 ft away.
  - {check: turn, leg: base, near: {ref: runway, airport: KVNY, runway: 34R, part: threshold}, tol_ft: 7300}
  - {check: touch_and_go}
  - {check: no_go_around}
  - {check: no_crash}
